<!--
  A LOCAL PREVIEW HARNESS, NOT PART OF THE SITE.

  It loads the real page scripts and the real stylesheet, but replaces
  everything that talks to Supabase with made-up data, so the pages can be
  looked at without signing in and without the database migrations having run.

  Nothing here reads or writes anything real: there is no Supabase client on
  this page at all. Delete this file before going live, or leave it, it cannot
  reach any actual data either way.
-->

<script>

async function getDocumentUrl() { alert("In the preview there is no real file to open."); throw new Error("preview"); }
async function reviewModuleDocument() { alert("Approve and reject do nothing in the preview."); }

// ---- load whichever page was asked for ----------------------------------

const PAGE_SCRIPTS = {
  home: "js/index-page.js",
  training: "js/training-page.js",
  module: "js/module-page.js",
  admin: "js/admin-page.js"
};

const page = new URLSearchParams(location.search).get("page") || "home";
const scriptSrc = PAGE_SCRIPTS[page];

if (!scriptSrc) {
  document.getElementById("app").innerHTML =
    '<div class="centernote"><h2>Unknown preview page</h2><p>Use the links above.</p></div>';
} else {
  const tag = document.createElement("script");
  tag.src = scriptSrc + "?v=24";
  document.body.appendChild(tag);
}
</script>
